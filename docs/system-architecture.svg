<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 720" width="1320" height="720" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .container { fill:#f8fafc; stroke:#cbd5e1; stroke-width:1.5; }
      .box { stroke-width:1.5; }
      .hd { font-size:16px; font-weight:700; fill:#0f172a; }
      .sub { font-size:12px; fill:#64748b; }
      .big { font-size:14px; font-weight:700; fill:#0f172a; }
      .mid { font-size:12.5px; font-weight:600; fill:#0f172a; }
      .small { font-size:11px; fill:#475569; }
      .tinier { font-size:10.5px; fill:#475569; }
      .pill { font-size:13px; font-weight:600; fill:#0f172a; }
      .arrowlabel { font-size:11px; font-weight:700; fill:#0f766e; }
      .flowlabel { font-size:12.5px; font-weight:700; fill:#0f766e; }
    </style>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arwteal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1320" height="720" fill="#ffffff"/>

  <text x="40" y="52" font-size="28" font-weight="700" fill="#0f172a">AlvanzStock — System Architecture</text>
  <text x="40" y="80" font-size="15" fill="#64748b">High-level request flow, Django applications, and the real-time WebSocket path</text>

  <!-- ============ CLIENTS ============ -->
  <rect class="container" x="40" y="130" width="210" height="470" rx="16"/>
  <text class="hd" x="58" y="164">Clients</text>
  <text class="sub" x="58" y="184">Role-based browser</text>

  <rect class="box" x="56" y="202" width="178" height="40" rx="8" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text class="pill" x="145" y="227" text-anchor="middle">Manager</text>

  <rect class="box" x="56" y="250" width="178" height="40" rx="8" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text class="pill" x="145" y="275" text-anchor="middle">Cashier</text>

  <rect class="box" x="56" y="298" width="178" height="40" rx="8" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text class="pill" x="145" y="323" text-anchor="middle">Staff</text>

  <rect class="box" x="56" y="346" width="178" height="40" rx="8" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text class="pill" x="145" y="371" text-anchor="middle">Stock Viewer</text>

  <line x1="56" y1="404" x2="234" y2="404" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect class="box" x="56" y="418" width="178" height="56" rx="8" fill="#ccfbf1" stroke="#5eead4"/>
  <text class="mid" x="145" y="442" text-anchor="middle">Live low-stock</text>
  <text class="mid" x="145" y="460" text-anchor="middle">desktop toast</text>

  <!-- ============ TRANSPORT ============ -->
  <rect class="container" x="300" y="130" width="150" height="470" rx="16"/>
  <text class="hd" x="318" y="164">Transport</text>

  <rect class="box" x="316" y="196" width="118" height="96" rx="10" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text class="mid" x="375" y="236" text-anchor="middle">HTTP /</text>
  <text class="mid" x="375" y="254" text-anchor="middle">HTTPS</text>
  <text class="tinier" x="375" y="274" text-anchor="middle">page requests</text>

  <rect class="box" x="316" y="322" width="118" height="96" rx="10" fill="#ccfbf1" stroke="#5eead4"/>
  <text class="mid" x="375" y="360" text-anchor="middle">WebSocket</text>
  <text class="mid" x="375" y="378" text-anchor="middle">ws/stock/</text>
  <text class="tinier" x="375" y="398" text-anchor="middle">real-time</text>

  <!-- ============ ASGI SERVER ============ -->
  <rect class="container" x="500" y="130" width="190" height="470" rx="16"/>
  <text class="hd" x="518" y="164">ASGI Server</text>

  <rect class="box" x="516" y="196" width="158" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="big" x="595" y="230" text-anchor="middle">Daphne</text>
  <text class="tinier" x="595" y="250" text-anchor="middle">ASGI web server</text>

  <rect class="box" x="516" y="290" width="158" height="116" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text class="mid" x="595" y="316" text-anchor="middle">ProtocolTypeRouter</text>
  <text class="tinier" x="595" y="340" text-anchor="middle">http → Django</text>
  <text class="tinier" x="595" y="360" text-anchor="middle">websocket →</text>
  <text class="tinier" x="595" y="380" text-anchor="middle">AuthMiddlewareStack</text>
  <text class="tinier" x="595" y="398" text-anchor="middle">→ URLRouter</text>

  <rect class="box" x="516" y="424" width="158" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="big" x="595" y="452" text-anchor="middle">StockConsumer</text>
  <text class="tinier" x="595" y="474" text-anchor="middle">Channels consumer</text>

  <!-- ============ DJANGO ============ -->
  <rect class="container" x="740" y="130" width="350" height="470" rx="16"/>
  <text class="hd" x="758" y="164">Django Applications</text>

  <rect class="box" x="756" y="182" width="318" height="66" rx="10" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text class="big" x="772" y="208">accounts</text>
  <text class="small" x="772" y="230">User + roles &amp; permissions</text>

  <rect class="box" x="756" y="260" width="318" height="92" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text class="big" x="772" y="286">inventory</text>
  <text class="small" x="772" y="308">Category, Product, StockTransaction</text>
  <text class="small" x="772" y="328">consumers.py · realtime.py · routing.py</text>

  <rect class="box" x="756" y="364" width="318" height="92" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
  <text class="big" x="772" y="390">pos</text>
  <text class="small" x="772" y="412">Sale, SaleItem, Return, ReturnItem</text>
  <text class="small" x="772" y="432">record_sale() · record_return() · views/urls</text>

  <rect class="box" x="756" y="468" width="318" height="110" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text class="mid" x="772" y="492">Request pipeline</text>
  <text class="small" x="772" y="516">Middleware (StockViewerAccess)</text>
  <text class="small" x="772" y="538">URL router → views</text>
  <text class="small" x="772" y="560">Templates · JSON · CSV</text>

  <!-- ============ DATA & REALTIME ============ -->
  <rect class="container" x="1140" y="130" width="140" height="470" rx="16"/>
  <text class="hd" x="1156" y="164">Data &amp;</text>
  <text class="hd" x="1156" y="184">Realtime</text>

  <rect class="box" x="1156" y="196" width="108" height="70" rx="10" fill="#ede9fe" stroke="#c4b5fd"/>
  <text class="mid" x="1210" y="226" text-anchor="middle">SQLite</text>
  <text class="tinier" x="1210" y="246" text-anchor="middle">database</text>

  <rect class="box" x="1156" y="278" width="108" height="70" rx="10" fill="#ede9fe" stroke="#c4b5fd"/>
  <text class="mid" x="1210" y="308" text-anchor="middle">media/</text>
  <text class="tinier" x="1210" y="328" text-anchor="middle">uploads</text>

  <rect class="box" x="1156" y="360" width="108" height="128" rx="10" fill="#fae8ff" stroke="#f0abfc"/>
  <text class="mid" x="1210" y="386" text-anchor="middle">Channel</text>
  <text class="mid" x="1210" y="404" text-anchor="middle">layer</text>
  <text class="tinier" x="1210" y="426" text-anchor="middle">InMemory</text>
  <text class="tinier" x="1210" y="444" text-anchor="middle">group:</text>
  <text class="tinier" x="1210" y="462" text-anchor="middle">stock_updates</text>

  <rect class="box" x="1156" y="500" width="108" height="78" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text class="mid" x="1210" y="524" text-anchor="middle">Static</text>
  <text class="tinier" x="1210" y="544" text-anchor="middle">output.css</text>
  <text class="tinier" x="1210" y="562" text-anchor="middle">chart.umd.min.js</text>

  <!-- ============ FLOW ARROWS ============ -->
  <line x1="250" y1="330" x2="300" y2="330" stroke="#64748b" stroke-width="2.5" marker-end="url(#arw)"/>
  <line x1="300" y1="352" x2="250" y2="352" stroke="#64748b" stroke-width="2.5" marker-end="url(#arw)"/>
  <text class="arrowlabel" x="275" y="316" text-anchor="middle">HTTP</text>

  <line x1="450" y1="330" x2="500" y2="330" stroke="#64748b" stroke-width="2.5" marker-end="url(#arw)"/>
  <line x1="500" y1="352" x2="450" y2="352" stroke="#64748b" stroke-width="2.5" marker-end="url(#arw)"/>
  <text class="arrowlabel" x="475" y="316" text-anchor="middle">route</text>

  <line x1="690" y1="330" x2="740" y2="330" stroke="#64748b" stroke-width="2.5" marker-end="url(#arw)"/>
  <line x1="740" y1="352" x2="690" y2="352" stroke="#64748b" stroke-width="2.5" marker-end="url(#arw)"/>
  <text class="arrowlabel" x="715" y="316" text-anchor="middle">call</text>

  <line x1="1090" y1="330" x2="1140" y2="330" stroke="#64748b" stroke-width="2.5" marker-end="url(#arw)"/>
  <line x1="1140" y1="352" x2="1090" y2="352" stroke="#64748b" stroke-width="2.5" marker-end="url(#arw)"/>
  <text class="arrowlabel" x="1115" y="316" text-anchor="middle">ORM</text>

  <!-- ============ REALTIME PUSH LOOP ============ -->
  <path d="M1210,600 V652 H145 V600" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arwteal)"/>
  <rect x="330" y="636" width="640" height="30" rx="6" fill="#ffffff" stroke="#5eead4" stroke-width="1"/>
  <text class="flowlabel" x="650" y="656" text-anchor="middle">WebSocket push — live stock · low-stock toast · sale/return analytics refresh</text>
</svg>
